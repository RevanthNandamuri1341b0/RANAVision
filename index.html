<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RANAVision — Battle Intelligence. Global Vision.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet"/>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #080808;
    --red: #FF2020;
    --grey: #3A3A3A;
    --white: #E8E8E8;
    --gold: #FFD700;
    --orange: #FF8C00;
  }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Courier Prime', monospace;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── TOP BAR ── */
  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: 56px;
    background: #0f0f0f;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
    z-index: 100;
  }

  #logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    user-select: none;
  }
  #logo .rana { color: var(--red); }
  #logo .vision { color: var(--white); }
  #logo .tagline {
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    color: #666;
    letter-spacing: 1px;
    display: block;
    margin-top: -4px;
  }

  #mode-toggle { display: flex; gap: 8px; }

  .mode-btn {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 1.5px;
    padding: 6px 18px;
    border: 1px solid #444;
    background: transparent;
    color: #888;
    cursor: pointer;
    transition: all 0.2s;
    clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
  }
  .mode-btn:hover { border-color: var(--red); color: var(--white); }
  .mode-btn.active { background: var(--red); border-color: var(--red); color: var(--white); }

  /* ── MAP CONTAINER ── */
  #map-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  #map-svg {
    width: 100%;
    height: 100%;
  }

  .country {
    stroke: #1a1a1a;
    stroke-width: 0.5;
    cursor: pointer;
    transition: filter 0.15s;
  }
  .country:hover { filter: brightness(1.5); }

  .conflict-country {
    animation: conflictPulse 2s ease-in-out infinite;
  }

  @keyframes conflictPulse {
    0%, 100% { filter: drop-shadow(0 0 4px #FF2020) brightness(1.2); }
    50% { filter: drop-shadow(0 0 12px #FF2020) drop-shadow(0 0 20px #FF2020) brightness(1.5); }
  }

  /* ── TOOLTIP ── */
  #tooltip {
    position: fixed;
    background: #111;
    border: 1px solid var(--red);
    padding: 10px 14px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 240px;
    z-index: 500;
    font-size: 12px;
  }
  #tooltip.visible { opacity: 1; }
  #tooltip img { width: 32px; margin-bottom: 6px; display: block; }
  #tooltip .tt-name { font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: var(--red); }
  #tooltip .tt-summary { color: #aaa; margin-top: 4px; line-height: 1.4; }

  /* ── CONFLICT DRAWER ── */
  #conflict-drawer {
    position: fixed;
    top: 56px;
    right: -420px;
    width: 380px;
    height: calc(100vh - 56px);
    background: #0d0d0d;
    border-left: 2px solid var(--red);
    overflow-y: auto;
    transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 400;
    padding: 20px;
  }
  #conflict-drawer.open { right: 0; }

  #drawer-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: none;
    border: 1px solid #444;
    color: #888;
    cursor: pointer;
    font-size: 16px;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  #drawer-close:hover { border-color: var(--red); color: var(--red); }

  #drawer-flag { width: 64px; margin-bottom: 12px; border: 1px solid #333; }
  #drawer-name { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--red); line-height: 1; margin-bottom: 8px; padding-right: 32px; }

  .drawer-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .meta-tag {
    font-size: 11px;
    background: #1a1a1a;
    border: 1px solid #333;
    padding: 3px 8px;
    color: #888;
  }
  .meta-tag span { color: var(--white); }

  #drawer-desc { font-size: 13px; color: #bbb; line-height: 1.6; margin-bottom: 16px; }

  .drawer-section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 1px;
    color: #555;
    margin-bottom: 6px;
  }

  #drawer-parties { font-size: 12px; color: #aaa; margin-bottom: 16px; line-height: 1.5; }

  .wiki-btn {
    display: inline-block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 1px;
    padding: 8px 20px;
    border: 1px solid var(--red);
    color: var(--red);
    text-decoration: none;
    transition: all 0.2s;
    clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
  }
  .wiki-btn:hover { background: var(--red); color: var(--white); }

  /* ── ARSENAL OVERLAY ── */
  #arsenal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 600;
    display: none;
    overflow-y: auto;
    padding: 20px;
  }
  #arsenal-overlay.open { display: block; }

  #arsenal-card {
    max-width: 900px;
    margin: 20px auto;
    background: #0d0d0d;
    border: 1px solid #333;
    padding: 28px;
    position: relative;
  }

  #arsenal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: 1px solid #444;
    color: #888;
    cursor: pointer;
    font-size: 18px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  #arsenal-close:hover { border-color: var(--red); color: var(--red); }

  #arsenal-header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
  #arsenal-flag { width: 80px; border: 1px solid #333; }
  #arsenal-country-name { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--white); }
  .tier-badge {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    padding: 4px 12px;
    margin-top: 4px;
    display: inline-block;
    letter-spacing: 1px;
  }
  .tier-1 { background: var(--gold); color: #000; }
  .tier-2 { background: var(--orange); color: #000; }
  .tier-3 { background: #5A5A5A; color: var(--white); }

  /* Weapon tabs */
  #weapon-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 1px solid #222; padding-bottom: 12px; }

  .weapon-tab {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 5px 14px;
    border: 1px solid #333;
    background: transparent;
    color: #666;
    cursor: pointer;
    transition: all 0.2s;
  }
  .weapon-tab:hover { color: var(--white); border-color: #555; }
  .weapon-tab.active { background: var(--grey); color: var(--white); border-color: var(--grey); }

  #weapon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }

  .weapon-card {
    background: #111;
    border: 1px solid #222;
    padding: 14px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .weapon-card:hover { border-color: var(--red); background: #161616; }
  .weapon-card .wc-name { font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: var(--white); margin-bottom: 4px; }
  .weapon-card .wc-type { font-size: 10px; color: var(--red); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .weapon-card .wc-desc { font-size: 11px; color: #777; line-height: 1.4; }

  .no-data { color: #444; font-size: 13px; text-align: center; padding: 30px; }

  /* ── WEAPON HERO ── */
  #weapon-hero {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 800;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #weapon-hero.open { display: flex; }

  #hero-card {
    background: #0d0d0d;
    border: 1px solid var(--red);
    box-shadow: 0 0 30px rgba(255,32,32,0.3), 0 0 60px rgba(255,32,32,0.1);
    padding: 30px;
    max-width: 560px;
    width: 100%;
    position: relative;
    animation: heroIn 0.25s ease-out;
  }
  @keyframes heroIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }

  #hero-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: none;
    border: 1px solid var(--red);
    color: var(--red);
    cursor: pointer;
    font-size: 18px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  #hero-close:hover { background: var(--red); color: var(--white); }

  #hero-type { font-size: 11px; color: var(--red); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
  #hero-name { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--white); margin-bottom: 10px; padding-right: 36px; }
  #hero-desc { font-size: 13px; color: #aaa; line-height: 1.6; margin-bottom: 20px; }

  #hero-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    border-top: 1px solid #222;
    padding-top: 16px;
  }
  .stat-item { background: #111; padding: 10px 12px; border: 1px solid #1e1e1e; }
  .stat-key { font-size: 10px; color: #555; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
  .stat-val { font-size: 15px; color: var(--white); font-weight: 700; }

  /* Legend */
  #map-legend {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: rgba(13,13,13,0.9);
    border: 1px solid #333;
    padding: 12px 16px;
    font-size: 12px;
    z-index: 200;
    display: none;
  }
  #map-legend.visible { display: block; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .legend-item:last-child { margin-bottom: 0; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

  /* Mobile */
  @media (max-width: 768px) {
    #conflict-drawer { width: 100%; right: -100%; top: auto; bottom: -60vh; height: 60vh; border-left: none; border-top: 2px solid var(--red); }
    #conflict-drawer.open { right: 0; bottom: 0; }
    #arsenal-card { padding: 16px; }
    #weapon-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    #logo .tagline { display: none; }
    .mode-btn { font-size: 12px; padding: 5px 12px; }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div id="logo">
    <span class="rana">RANA</span><span class="vision">Vision</span>
    <span class="tagline">BATTLE INTELLIGENCE. GLOBAL VISION.</span>
  </div>
  <div id="mode-toggle">
    <button class="mode-btn active" id="btn-conflict" onclick="setMode('conflict')">CONFLICT MAP</button>
    <button class="mode-btn" id="btn-arsenal" onclick="setMode('arsenal')">ARSENAL MAP</button>
  </div>
</div>

<!-- MAP -->
<div id="map-container">
  <svg id="map-svg"></svg>
</div>

<!-- TOOLTIP -->
<div id="tooltip">
  <img id="tt-flag" src="" alt=""/>
  <div class="tt-name" id="tt-name"></div>
  <div class="tt-summary" id="tt-summary"></div>
</div>

<!-- CONFLICT DRAWER -->
<div id="conflict-drawer">
  <button id="drawer-close" onclick="closeDrawer()">✕</button>
  <img id="drawer-flag" src="" alt=""/>
  <div id="drawer-name"></div>
  <div class="drawer-meta" id="drawer-meta"></div>
  <div id="drawer-desc"></div>
  <div class="drawer-section-title">PARTIES INVOLVED</div>
  <div id="drawer-parties"></div>
  <br/>
  <a class="wiki-btn" id="drawer-wiki" href="#" target="_blank" rel="noopener">WIKIPEDIA ↗</a>
</div>

<!-- ARSENAL OVERLAY -->
<div id="arsenal-overlay" onclick="handleOverlayClick(event)">
  <div id="arsenal-card">
    <button id="arsenal-close" onclick="closeArsenal()">✕</button>
    <div id="arsenal-header">
      <img id="arsenal-flag" src="" alt=""/>
      <div>
        <div id="arsenal-country-name"></div>
        <span id="arsenal-tier-badge" class="tier-badge"></span>
      </div>
    </div>
    <div id="weapon-tabs"></div>
    <div id="weapon-grid"></div>
  </div>
</div>

<!-- WEAPON HERO -->
<div id="weapon-hero" onclick="handleHeroBackdrop(event)">
  <div id="hero-card">
    <button id="hero-close" onclick="closeHero()">✕</button>
    <div id="hero-type"></div>
    <div id="hero-name"></div>
    <div id="hero-desc"></div>
    <div id="hero-stats"></div>
  </div>
</div>

<!-- LEGEND -->
<div id="map-legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--gold)"></div> Tier 1 — Global Superpower</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--orange)"></div> Tier 2 — Regional Power</div>
  <div class="legend-item"><div class="legend-dot" style="background:#5A5A5A"></div> Tier 3 — Emerging Military</div>
</div>

<script>
// ═══════════════════════════════════════════
// DATA — CONFLICTS
// ═══════════════════════════════════════════
const CONFLICTS = [
  { id:'ua', country:'UA', name:'Russia–Ukraine War', summary:'Full-scale Russian invasion of Ukraine ongoing since Feb 2022.', description:'Russia launched a full-scale invasion of Ukraine on 24 February 2022, the largest armed conflict in Europe since World War II. Fighting spans eastern and southern Ukraine with massive casualties on both sides and widespread infrastructure destruction.', parties:'Russia vs. Ukraine (backed by NATO allies)', startYear:2022, wikipediaUrl:'https://en.wikipedia.org/wiki/Russian_invasion_of_Ukraine' },
  { id:'ps', country:'PS', name:'Gaza–Israel Conflict', summary:'Intense military operations in Gaza following Hamas attack in Oct 2023.', description:'Following the Hamas terrorist attacks of 7 October 2023 that killed ~1,200 Israelis, Israel launched a major military campaign in the Gaza Strip. The conflict has caused severe humanitarian crisis with tens of thousands of casualties.', parties:'Israel (IDF) vs. Hamas, Islamic Jihad', startYear:2023, wikipediaUrl:'https://en.wikipedia.org/wiki/2023_Hamas-led_attack_on_Israel' },
  { id:'sd', country:'SD', name:'Sudan Civil War', summary:'War between Sudanese Armed Forces and RSF paramilitaries.', description:'Since April 2023, the Sudanese Armed Forces (SAF) and the Rapid Support Forces (RSF) have been engaged in a devastating civil war. The conflict has triggered one of the world\'s largest humanitarian crises, with millions displaced.', parties:'Sudanese Armed Forces vs. Rapid Support Forces (RSF)', startYear:2023, wikipediaUrl:'https://en.wikipedia.org/wiki/2023_Sudanese_civil_war' },
  { id:'mm', country:'MM', name:'Myanmar Civil War', summary:'Military junta vs. resistance forces after 2021 coup.', description:'Following the February 2021 coup by the Tatmadaw (military), Myanmar descended into civil war. The People\'s Defence Force and ethnic armed groups control large territories, while the junta faces widespread resistance across the country.', parties:'Military Junta (SAC) vs. PDF, Ethnic Armed Organisations', startYear:2021, wikipediaUrl:'https://en.wikipedia.org/wiki/Myanmar_civil_war_(2021–present)' },
  { id:'ye', country:'YE', name:'Yemen Civil War', summary:'Multi-sided conflict involving Houthis, government, and Saudi coalition.', description:'Yemen\'s civil war began in 2014 when Houthi forces seized the capital Sanaa. A Saudi-led coalition intervened in 2015 to restore the government. The Houthis have since launched missile and drone attacks on Saudi Arabia and ships in the Red Sea.', parties:'Houthis vs. Saudi-led Coalition, Yemeni Government', startYear:2014, wikipediaUrl:'https://en.wikipedia.org/wiki/Yemeni_civil_war_(2014–present)' },
  { id:'et', country:'ET', name:'Ethiopia Conflicts', summary:'Ongoing regional insurgencies in Amhara and Oromia.', description:'Though the Tigray War ended in late 2022, Ethiopia faces new conflicts. Armed conflict in the Amhara region between federal forces and Fano militias, and ongoing Oromo Liberation Army insurgency continue to destabilize the country.', parties:'Ethiopian Federal Forces vs. Fano Militia, OLA', startYear:2023, wikipediaUrl:'https://en.wikipedia.org/wiki/Amhara_conflict' },
  { id:'ht', country:'HT', name:'Haiti Gang Violence', summary:'Gang control covers majority of Port-au-Prince amid state collapse.', description:'Haitian gangs, primarily the G9 coalition led by Jimmy Chérizier, control large swaths of Port-au-Prince. The state has effectively collapsed following President Moïse\'s assassination. A Kenyan-led multinational security force deployed in 2024.', parties:'Government vs. G9 and Allied Gangs', startYear:2021, wikipediaUrl:'https://en.wikipedia.org/wiki/2021%E2%80%93present_Haitian_crisis' },
  { id:'ml', country:'ML', name:'Mali Insurgency', summary:'Jihadist insurgency by JNIM and ISGS across the Sahel.', description:'Mali faces a severe jihadist insurgency by Jamaat Nusrat al-Islam wal-Muslimin (JNIM) and Islamic State in the Greater Sahara (ISGS). The military junta expelled French forces and now relies on Wagner Group/Africa Corps mercenaries.', parties:'Mali Military Junta + Wagner vs. JNIM, ISGS', startYear:2012, wikipediaUrl:'https://en.wikipedia.org/wiki/Northern_Mali_conflict' },
  { id:'ne', country:'NE', name:'Sahel Crisis (Niger)', summary:'Post-coup instability and jihadist activity in Niger.', description:'Following the July 2023 coup that ousted President Bazoum, Niger expelled French troops and joined a military bloc with Mali and Burkina Faso. Jihadist groups have intensified attacks, and the country faces international sanctions.', parties:'Military Junta vs. JNIM, ISGS, Western sanctions', startYear:2023, wikipediaUrl:'https://en.wikipedia.org/wiki/2023_Nigerien_coup_d%27%C3%A9tat' },
  { id:'so', country:'SO', name:'Somalia — Al-Shabaab', summary:'Al-Shabaab controls large rural areas and launches urban attacks.', description:'Al-Shabaab, an Al-Qaeda affiliate, continues to hold significant territory in southern Somalia and carries out devastating bombings and attacks. The Somali National Army, supported by African Union forces, continues offensive operations against them.', parties:'Somali Government + ATMIS vs. Al-Shabaab', startYear:2006, wikipediaUrl:'https://en.wikipedia.org/wiki/Al-Shabaab_(militant_group)' },

  { id:'az', country:'AZ', name:'Nagorno-Karabakh Aftermath', summary:'Azerbaijan controls Karabakh; 100k Armenians fled in 2023.', description:'In September 2023, Azerbaijan launched a 24-hour military operation capturing the entirety of Nagorno-Karabakh. Over 100,000 ethnic Armenians fled. The region is now under Azerbaijani control, raising concerns about remaining Armenians.', parties:'Azerbaijan vs. Ethnic Armenian Forces (concluded 2023)', startYear:2020, wikipediaUrl:'https://en.wikipedia.org/wiki/2023_Azerbaijani_offensive_in_Nagorno-Karabakh' },
  { id:'sy', country:'SY', name:'Syrian Civil War', summary:'Assad regime fell Dec 2024; HTS controls Damascus.', description:'After 13 years of civil war, Hayat Tahrir al-Sham (HTS) and allied factions launched a rapid offensive in late 2024, capturing Damascus in December 2024. Assad fled to Russia. Syria now faces a complex transition with multiple armed factions.', parties:'HTS + Allied Factions vs. Assad Remnants, ISIS, Kurds', startYear:2011, wikipediaUrl:'https://en.wikipedia.org/wiki/Syrian_civil_war' },
  { id:'iq', country:'IQ', name:'Iraq — ISIS Remnants', summary:'ISIS remnants carry out guerrilla attacks in Iraq.', description:'Though the ISIS territorial caliphate was defeated in 2017, ISIS continues to operate as an insurgent group in remote areas of Iraq, carrying out hit-and-run attacks, assassinations, and bombings targeting security forces.', parties:'Iraqi Security Forces + PMF vs. ISIS remnants', startYear:2013, wikipediaUrl:'https://en.wikipedia.org/wiki/War_in_Iraq_(2013%E2%80%932017)' },
  { id:'af', country:'AF', name:'Afghanistan — Taliban Rule', summary:'Taliban government faces ISIS-K attacks and internal tensions.', description:'The Taliban retook control of Afghanistan in August 2021 following the US withdrawal. The country now faces severe humanitarian crisis, suppression of women\'s rights, and ongoing attacks by ISIS-Khorasan Province (ISIS-K) targeting civilians and Taliban forces.', parties:'Taliban Government vs. ISIS-K, NRF resistance', startYear:2021, wikipediaUrl:'https://en.wikipedia.org/wiki/Islamic_Emirate_of_Afghanistan' },
  { id:'pk', country:'PK', name:'Pakistan — TTP Insurgency', summary:'Tehrik-i-Taliban Pakistan attacks intensify across KP and Balochistan.', description:'The Tehrik-i-Taliban Pakistan (TTP) has dramatically increased attacks on Pakistani security forces since 2022, particularly in Khyber Pakhtunkhwa and Balochistan provinces. Pakistan has launched cross-border strikes into Afghanistan targeting TTP bases.', parties:'Pakistan Security Forces vs. TTP (Pakistani Taliban)', startYear:2007, wikipediaUrl:'https://en.wikipedia.org/wiki/Tehrik-i-Taliban_Pakistan' },
  { id:'xk', country:'RS', name:'Kosovo Tensions', summary:'Serbia–Kosovo relations remain volatile; clashes at border.', description:'Relations between Serbia and Kosovo remain highly volatile. Major incidents in 2023 included an armed attack by Serbian gunmen in northern Kosovo. Both sides maintain military postures and diplomatic disputes continue over Kosovo\'s independence.', parties:'Kosovo vs. Serbia, Serbian-backed groups', startYear:2022, wikipediaUrl:'https://en.wikipedia.org/wiki/Kosovo%E2%80%93Serbia_relations' },

  '478':'MR','646':'RW','686':'SN','706':'SO','834':'TZ','894':'ZM'

// Conflict ISO2 codes
const CONFLICT_COUNTRIES = new Set(CONFLICTS.map(c => c.country));

// Military country ISO2
const MILITARY_COUNTRIES = new Map(Object.entries(MILITARY).map(([k,v]) => [v.iso2.toUpperCase(), v]));

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let currentMode = 'conflict';
let currentArsenalCountry = null;
let currentWeaponCategory = 'warWeapons';
const WEAPON_CATS = ['warWeapons','warVehicles','warJets','warShips','nuclearWeapons','other'];
const CAT_LABELS = { warWeapons:'War Weapons', warVehicles:'Vehicles', warJets:'Jets', warShips:'Ships', nuclearWeapons:'Nuclear', other:'Other' };

// ═══════════════════════════════════════════
// MODE TOGGLE
// ═══════════════════════════════════════════
function setMode(mode) {
  currentMode = mode;
  document.getElementById('btn-conflict').classList.toggle('active', mode === 'conflict');
  document.getElementById('btn-arsenal').classList.toggle('active', mode === 'arsenal');
  document.getElementById('map-legend').classList.toggle('visible', mode === 'arsenal');
  closeDrawer();
  closeArsenal();
  renderMap();
}

// ═══════════════════════════════════════════
// MAP RENDERING
// ═══════════════════════════════════════════
let worldData = null;
const svg = d3.select('#map-svg');
let g = svg.append('g');
let projection, pathGen;

function initMap(world) {
  worldData = world;
  const container = document.getElementById('map-container');
  const W = container.clientWidth;
  const H = container.clientHeight;

  projection = d3.geoNaturalEarth1()
    .scale(W / 6.4)
    .translate([W / 2, H / 2]);
  pathGen = d3.geoPath().projection(projection);

  // Zoom
  const zoom = d3.zoom().scaleExtent([1, 8]).on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom);

  renderMap();

  // Resize
  window.addEventListener('resize', () => {
    const W2 = container.clientWidth, H2 = container.clientHeight;
    projection.scale(W2 / 6.4).translate([W2 / 2, H2 / 2]);
    pathGen = d3.geoPath().projection(projection);
    renderMap();
  });
}

function getCountryColor(iso2) {
  if (!iso2) return '#2A2A2A';
  if (currentMode === 'conflict') {
    return CONFLICT_COUNTRIES.has(iso2.toUpperCase()) ? '#FF2020' : '#3A3A3A';
  } else {
    const mil = MILITARY_COUNTRIES.get(iso2.toUpperCase());
    if (!mil) return '#2A2A2A';
    if (mil.tier === 1) return '#FFD700';
    if (mil.tier === 2) return '#FF8C00';
    return '#5A5A5A';
  }
}

function renderMap() {
  if (!worldData) return;
  const countries = topojson.feature(worldData, worldData.objects.countries).features;

  g.selectAll('.country').remove();

  g.selectAll('.country')
    .data(countries)
    .join('path')
    .attr('class', d => {
      const iso2 = ISO_NUM_TO_ALPHA2[String(d.id).padStart(3,'0')];
      let cls = 'country';
      if (currentMode === 'conflict' && iso2 && CONFLICT_COUNTRIES.has(iso2.toUpperCase())) {
        cls += ' conflict-country';
      }
      return cls;
    })
    .attr('d', pathGen)
    .attr('fill', d => {
      const iso2 = ISO_NUM_TO_ALPHA2[String(d.id).padStart(3,'0')];
      return getCountryColor(iso2);
    })
    .on('mousemove', (event, d) => showTooltip(event, d))
    .on('mouseleave', hideTooltip)
    .on('click', (event, d) => handleCountryClick(event, d));
}

// ═══════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════
const tooltip = document.getElementById('tooltip');

function showTooltip(event, d) {
  const iso2 = ISO_NUM_TO_ALPHA2[String(d.id).padStart(3,'0')];
  if (!iso2) return;

  let name = '', summary = '', showFlag = false;

  if (currentMode === 'conflict') {
    const c = CONFLICTS.find(c => c.country.toUpperCase() === iso2.toUpperCase());
    if (!c) return;
    name = c.name;
    summary = c.summary;
    showFlag = true;
    document.getElementById('tt-flag').src = `https://flagcdn.com/w80/${iso2.toLowerCase()}.png`;
    document.getElementById('tt-flag').style.display = 'block';
  } else {
    const mil = MILITARY_COUNTRIES.get(iso2.toUpperCase());
    if (!mil) return;
    name = mil.name;
    summary = `Military Tier ${mil.tier} — Click to view arsenal`;
    showFlag = true;
    document.getElementById('tt-flag').src = `https://flagcdn.com/w80/${iso2.toLowerCase()}.png`;
    document.getElementById('tt-flag').style.display = 'block';
  }

  document.getElementById('tt-name').textContent = name;
  document.getElementById('tt-summary').textContent = summary;

  const x = event.clientX + 14;
  const y = event.clientY - 10;
  tooltip.style.left = Math.min(x, window.innerWidth - 260) + 'px';
  tooltip.style.top = Math.min(y, window.innerHeight - 120) + 'px';
  tooltip.classList.add('visible');
}

function hideTooltip() {
  tooltip.classList.remove('visible');
}

// ═══════════════════════════════════════════
// COUNTRY CLICK
// ═══════════════════════════════════════════
function handleCountryClick(event, d) {
  event.stopPropagation();
  const iso2 = ISO_NUM_TO_ALPHA2[String(d.id).padStart(3,'0')];
  if (!iso2) return;

  if (currentMode === 'conflict') {
    const c = CONFLICTS.find(c => c.country.toUpperCase() === iso2.toUpperCase());
    if (c) openDrawer(c);
  } else {
    const mil = MILITARY_COUNTRIES.get(iso2.toUpperCase());
    if (mil) openArsenal(mil, iso2);
  }
}

// ═══════════════════════════════════════════
// CONFLICT DRAWER
// ═══════════════════════════════════════════
function openDrawer(conflict) {
  document.getElementById('drawer-flag').src = `https://flagcdn.com/w80/${conflict.country.toLowerCase()}.png`;
  document.getElementById('drawer-name').textContent = conflict.name;
  document.getElementById('drawer-desc').textContent = conflict.description;
  document.getElementById('drawer-parties').textContent = conflict.parties;
  document.getElementById('drawer-wiki').href = conflict.wikipediaUrl;

  const meta = document.getElementById('drawer-meta');
  meta.innerHTML = `
    <div class="meta-tag">Since <span>${conflict.startYear}</span></div>
    <div class="meta-tag">Country <span>${conflict.country}</span></div>
  `;
  document.getElementById('conflict-drawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('conflict-drawer').classList.remove('open');
}

// ═══════════════════════════════════════════
// ARSENAL OVERLAY
// ═══════════════════════════════════════════
function openArsenal(mil, iso2) {
  currentArsenalCountry = mil;
  document.getElementById('arsenal-flag').src = `https://flagcdn.com/w80/${iso2.toLowerCase()}.png`;
  document.getElementById('arsenal-country-name').textContent = mil.name;
  const badge = document.getElementById('arsenal-tier-badge');
  badge.textContent = `TIER ${mil.tier}`;
  badge.className = `tier-badge tier-${mil.tier}`;

  // Build tabs
  const tabsEl = document.getElementById('weapon-tabs');
  tabsEl.innerHTML = '';
  WEAPON_CATS.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'weapon-tab' + (cat === 'warWeapons' ? ' active' : '');
    btn.textContent = CAT_LABELS[cat];
    btn.onclick = () => switchWeaponCategory(cat);
    tabsEl.appendChild(btn);
  });

  currentWeaponCategory = 'warWeapons';
  renderWeaponGrid('warWeapons');
  document.getElementById('arsenal-overlay').classList.add('open');
}

function switchWeaponCategory(cat) {
  currentWeaponCategory = cat;
  document.querySelectorAll('.weapon-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.weapon-tab')[WEAPON_CATS.indexOf(cat)].classList.add('active');
  renderWeaponGrid(cat);
}

function renderWeaponGrid(cat) {
  const grid = document.getElementById('weapon-grid');
  const weapons = currentArsenalCountry[cat] || [];
  if (!weapons.length) {
    grid.innerHTML = '<div class="no-data">No data available for this category.</div>';
    return;
  }
  grid.innerHTML = weapons.map((w, i) => `
    <div class="weapon-card" onclick="openWeaponHero(${i})">
      <div class="wc-type">${w.type}</div>
      <div class="wc-name">${w.name}</div>
      <div class="wc-desc">${w.description.substring(0, 80)}${w.description.length > 80 ? '...' : ''}</div>
    </div>
  `).join('');
}

function closeArsenal() {
  document.getElementById('arsenal-overlay').classList.remove('open');
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('arsenal-overlay')) closeArsenal();
}

// ═══════════════════════════════════════════
// WEAPON HERO
// ═══════════════════════════════════════════
function openWeaponHero(index) {
  const w = currentArsenalCountry[currentWeaponCategory][index];
  document.getElementById('hero-type').textContent = w.type;
  document.getElementById('hero-name').textContent = w.name;
  document.getElementById('hero-desc').textContent = w.description;

  const statsEl = document.getElementById('hero-stats');
  statsEl.innerHTML = Object.entries(w.stats).map(([k, v]) => `
    <div class="stat-item">
      <div class="stat-key">${k}</div>
      <div class="stat-val">${v}</div>
    </div>
  `).join('');

  document.getElementById('weapon-hero').classList.add('open');
}

function closeHero() {
  document.getElementById('weapon-hero').classList.remove('open');
}

function handleHeroBackdrop(e) {
  if (e.target === document.getElementById('weapon-hero')) closeHero();
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
  .then(r => r.json())
  .then(world => initMap(world))
  .catch(err => {
    console.error('Failed to load map topology:', err);
    document.getElementById('map-container').innerHTML =
      '<div style="color:#FF2020;text-align:center;padding:40px;font-family:Courier Prime">⚠ Failed to load world map. Check your internet connection.</div>';
  });

// Close drawer on map click
document.getElementById('map-svg').addEventListener('click', () => closeDrawer());
</script>
